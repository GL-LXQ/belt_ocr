# 数据库与图片保存路径，相对本配置目录解析。
database_path: ../runtime/measurements.sqlite3
recovery_database_path: ../runtime/measurements.recovery.sqlite3
evidence_directory: ../runtime/evidence

# 存储队列容量与退出期限（毫秒）。
storage_queue_capacity: 32
shutdown_timeout_ms: 10000

# 容量检查间隔（毫秒）、积压上限与磁盘保留空间（字节）。
maintenance_interval_ms: 250
max_persistent_records: 1000
minimum_free_disk_bytes: 104857600
configuration_version: simulation-v1
