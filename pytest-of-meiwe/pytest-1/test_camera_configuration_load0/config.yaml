# 公共运行配置。相对路径以本文件所在目录为基准解析。
# 六个顶层段落对应 application/camera/ocr/frequency/machine/io 业务分组，配置键保持原名。

# 数据库与图片路径、退出期限。
application:
  database_path: ../runtime/measurements.sqlite3  # 业务库路径，含机器表与测量结果表
  recovery_database_path: ../runtime/measurements.recovery.sqlite3  # 运行库路径，保存异常事件审计
  evidence_directory: ../runtime/evidence  # 证据图片根目录

  shutdown_timeout_ms: 10000  # 退出收尾期限，毫秒

# 相机 SDK 目录与单轮采集参数。
camera:
  mvs_development_directory: D:/app/HIK/MVS/Development  # MVS SDK 开发目录
  mvs_dll_directory: null  # SDK 动态库目录，省略时查找 Windows 公共 MVS Runtime

  capture_window_ms: 1000  # 单轮采集窗口，毫秒
  camera_timeout_ms: 50  # 单次取帧超时，毫秒

  # 每次打开相机后写入的公共运行参数。
  camera_pixel_format: Mono8
  camera_exposure_time_us: 80.0
  camera_gain: 0.0

  # 按当前相机 MVS 中“线路选择器”的实际值填写，例如 Line2。
  camera_line_selector: Line2
  camera_line_mode: Strobe

  # 按当前 MVS 中用于频闪的 Line Source 实际值填写。
  camera_line_source: ExposureStartActive
  camera_strobe_enabled: true

# 共享 OCR 锁的等待期限与获得锁后的处理期限。
ocr:
  ocr_lock_wait_timeout_ms: 10000  # 等待共享 OCR 识别锁的最大时间，毫秒
  ocr_result_timeout_ms: 3000  # OCR 处理期限，毫秒

# 频率读取间隔与有效频率范围。
frequency:
  frequency_interval_ms: 100  # 频率读取间隔配置值，占位实现按此值等待下一次读数
  minimum_frequency_hz: 0.01  # 有效频率下限，单位赫兹
  maximum_frequency_hz: 10000.0  # 有效频率上限，单位赫兹

# 机器周期期限与事件队列容量，现场启停状态以 Modbus DI 实际读数为准。
machine:
  max_cycle_open_ms: 60000  # 等待 CLOSE 的期限，毫秒
  event_queue_capacity: 128  # 单机事件队列容量

# Modbus RTU 串口参数与机器到 DI 通道的绑定关系。
io:
  modbus_serial_port: COM8  # Modbus RTU 串口号
  modbus_baudrate: 115200  # 波特率
  modbus_parity: N  # 校验方式
  modbus_stopbits: 1  # 停止位数量
  modbus_bytesize: 8  # 数据位数量
  modbus_unit_id: 1  # Modbus 设备地址
  modbus_timeout_seconds: 3.0  # 单次请求超时，秒
  modbus_input_address: 0  # DI 起始地址
  modbus_poll_interval_ms: 50  # DI 轮询间隔，毫秒
  modbus_reconnect_interval_ms: 1000  # 通信失败后的重连等待间隔，毫秒
  io_machine_channels: {"1": 0}  # 机器编号到 DI 通道索引的映射，键为机器编号字符串
