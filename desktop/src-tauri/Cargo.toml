[package]
name = "beltvision-desktop"
version = "0.2.0"
description = "BeltVision local desktop owner"
edition = "2021"
rust-version = "1.85"

[lib]
name = "beltvision_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "beltvision-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-single-instance"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
dunce = "1"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [], optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
