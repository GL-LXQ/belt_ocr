[project]
name = "belt-ocr"
version = "0.2.0"
description = "多皮带机视觉监测与测量追溯"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pillow>=11,<13",
    "numpy>=1.26,<3",
    "opencv-contrib-python==4.10.0.84",
    "paddlepaddle==3.3.0",
    "paddleocr>=3.7,<4",
    "pydantic>=2.7,<3",
    "pymodbus>=3.15.0",
    "pyserial>=3.5",
    "pyyaml==6.0.2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1.4,<2", "httpx>=0.27,<1"]
build = ["pyinstaller>=6,<7"]

[tool.uv.sources]
paddlepaddle = { index = "paddle-cpu" }

[[tool.uv.index]]
name = "paddle-cpu"
url = "https://www.paddlepaddle.org.cn/packages/stable/cpu/"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
norecursedirs = ["legacy_ui", ".venv", "node_modules"]
